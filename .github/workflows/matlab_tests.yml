name: MATLAB MEX

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag (for example v1.0.0); when set, publish both tested packages to GitHub Release"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86-64
            runner: windows-2022
            platform: windows-x86_64
            matlab-release: R2025b
            mex-extension: mexw64
          - name: macOS Apple silicon
            runner: macos-15
            platform: macos-arm64
            matlab-release: R2025b
            mex-extension: mexmaca64

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MATLAB
        id: setup-matlab
        uses: matlab-actions/setup-matlab@v3
        with:
          release: ${{ matrix.matlab-release }}

      - name: Configure CMake
        shell: bash
        env:
          MATLAB_ROOT: ${{ steps.setup-matlab.outputs.matlabroot }}
        run: |
          args=(
            -S .
            -B build_matlab_mex
            -DBUILD_MATLAB_BINDINGS=ON
            -DPOLYSCOPE_BACKEND_OPENGL3_GLFW=ON
            -DPOLYSCOPE_BACKEND_OPENGL_MOCK=ON
            -DPOLYSCOPE_BACKEND_OPENGL3_EGL=OFF
            -DGLFW_BUILD_EXAMPLES=OFF
            -DGLFW_BUILD_TESTS=OFF
            -DGLFW_BUILD_DOCS=OFF
            -DGLFW_INSTALL=OFF
            "-DMatlab_ROOT_DIR=$MATLAB_ROOT"
          )

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            args+=(-G "Visual Studio 17 2022" -A x64)
          else
            args+=(-DCMAKE_BUILD_TYPE=Release)
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test "$(uname -m)" = "arm64"
            args+=(
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
            )
          fi

          cmake "${args[@]}"

      - name: Build MEX
        shell: bash
        run: >-
          cmake --build build_matlab_mex
          --target polyscope_mex
          --config Release
          --parallel 3

      - name: Verify generated MEX
        shell: bash
        env:
          MEX_FILE: src/matlab/+polyscope/private/polyscope_mex.${{ matrix.mex-extension }}
        run: |
          test -f "$MEX_FILE"
          file "$MEX_FILE"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            lipo -archs "$MEX_FILE" | grep -qw arm64
            file "$MEX_FILE" | grep -q 'arm64'
            if otool -L "$MEX_FILE" | grep -E '/(opt/homebrew|usr/local)/'; then
              echo "The MEX file contains a non-portable Homebrew dependency." >&2
              exit 1
            fi
            otool -L "$MEX_FILE"
            vtool -show-build "$MEX_FILE"
          fi

      - name: Run headless MATLAB binding tests and stage runtime package
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            run_all_tests_headless;
            release_polyscope(OutputRoot=fullfile(pwd,"dist","matlab"));

      - name: Verify staged runtime package
        shell: bash
        env:
          PACKAGE_DIR: dist/matlab/+polyscope
          MEX_NAME: polyscope_mex.${{ matrix.mex-extension }}
        run: |
          test -f "$PACKAGE_DIR/private/$MEX_NAME"
          test -f "$PACKAGE_DIR/private/call_mex.m"
          test -f "$PACKAGE_DIR/Polyscope.m"
          test -f "$PACKAGE_DIR/POLYSCOPE_MATLAB_VERSION.txt"

          count="$(find "$PACKAGE_DIR/private" -maxdepth 1 -type f -name 'polyscope_mex.mex*' | wc -l | tr -d ' ')"
          test "$count" = "1"

      - name: Archive runtime package
        shell: bash
        run: >-
          tar -C dist/matlab -czf
          "dist/polyscope-matlab-${{ matrix.platform }}.tar.gz"
          +polyscope

      - name: Upload MATLAB runtime package
        uses: actions/upload-artifact@v7
        with:
          name: polyscope-matlab-${{ matrix.platform }}
          path: dist/polyscope-matlab-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: assemble-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download unified tested package
        uses: actions/download-artifact@v8
        with:
          name: polyscope-matlab-supported-platforms
          path: release-assets

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#assets[@]}" = "1"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$RELEASE_TAG" \
              polyscope-matlab-windows-x86_64.tar.gz \
              --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release delete-asset "$RELEASE_TAG" \
              polyscope-matlab-macos-arm64.tar.gz \
              --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  assemble-package:
    name: Assemble shared MATLAB package
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v8
        with:
          pattern: polyscope-matlab-*
          path: platform-packages
          merge-multiple: true

      - name: Verify shared files and combine MEX binaries
        shell: bash
        run: |
          windows_archive="platform-packages/polyscope-matlab-windows-x86_64.tar.gz"
          macos_archive="platform-packages/polyscope-matlab-macos-arm64.tar.gz"
          test -f "$windows_archive"
          test -f "$macos_archive"

          mkdir -p unpack/windows unpack/macos unified
          tar -xzf "$windows_archive" -C unpack/windows
          tar -xzf "$macos_archive" -C unpack/macos

          diff -qr --strip-trailing-cr \
            --exclude='polyscope_mex.mexw64' \
            --exclude='polyscope_mex.mexmaca64' \
            unpack/windows/+polyscope \
            unpack/macos/+polyscope

          cp -a unpack/windows/+polyscope unified/+polyscope
          cp unpack/macos/+polyscope/private/polyscope_mex.mexmaca64 \
            unified/+polyscope/private/

          test -f unified/+polyscope/private/polyscope_mex.mexw64
          test -f unified/+polyscope/private/polyscope_mex.mexmaca64
          count="$(find unified/+polyscope/private -maxdepth 1 -type f -name 'polyscope_mex.mex*' | wc -l | tr -d ' ')"
          test "$count" = "2"

          tar -C unified -czf \
            polyscope-matlab-windows-x86_64-macos-arm64.tar.gz \
            +polyscope

      - name: Upload unified MATLAB package
        uses: actions/upload-artifact@v7
        with:
          name: polyscope-matlab-supported-platforms
          path: polyscope-matlab-windows-x86_64-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
