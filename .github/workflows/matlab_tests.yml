name: MATLAB Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  matlab-tests:
    name: MATLAB MEX tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cmake-flags: -DCMAKE_BUILD_TYPE=Release
            build-config: Release
          - os: windows-latest
            cmake-flags: -G "Visual Studio 17 2022" -A x64
            build-config: Release
          - os: macos-latest
            cmake-flags: -DCMAKE_BUILD_TYPE=Release
            build-config: Release

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MATLAB
        id: setup-matlab
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023a

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build_matlab_mex \
            -DBUILD_MATLAB_BINDINGS=ON \
            -DPOLYSCOPE_BACKEND_OPENGL3_GLFW=OFF \
            -DMatlab_ROOT_DIR="${{ steps.setup-matlab.outputs.matlabroot }}" \
            ${{ matrix.cmake-flags }}

      - name: Build MEX
        shell: bash
        run: |
          cmake --build build_matlab_mex --target polyscope_mex --config ${{ matrix.build-config }} -j4

      - name: Run headless MATLAB tests
        uses: matlab-actions/run-command@v2
        with:
          command: run_all_tests_headless
